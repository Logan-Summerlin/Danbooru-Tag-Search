name: Danbooru tag discovery live tests

on:
  push:
    branches:
      - main
      - step-2-through-5-complete
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q danbooru_tags

      - name: Run live client tests
        env:
          DANBOORU_USER_AGENT: "Logan-Summerlin/Danbooru-Tag-Search CI"
        run: python danbooru_tags/test_client.py

      - name: Run live discovery verification and refinement tests
        env:
          DANBOORU_USER_AGENT: "Logan-Summerlin/Danbooru-Tag-Search CI"
        run: python danbooru_tags/test_discovery.py
