name: Step 1 live Danbooru test

on:
  push:
    branches:
      - step-1-danbooru-client
  workflow_dispatch:

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install -r requirements.txt

      - name: Run Step 1 live sanity tests
        env:
          DANBOORU_USER_AGENT: "Logan-Summerlin/Danbooru-Tag-Search Step 1 (GitHub Actions)"
        run: python danbooru_tags/test_client.py
